name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Baut und testet gegen den SimConnect-Stub (das MSFS-SDK gibt es auf GitHub-Runnern nicht).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Duopilo.slnx -c Release -p:UseSimConnectStub=true "-flp:errorsonly;logfile=build-errors.log" "-flp1:warningsonly;logfile=build-warnings.log"

      # Build-Fehler als Annotation, damit sie ohne Log-Download sichtbar sind
      - name: Build-Fehler als Annotation
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-errors.log) {
            Get-Content build-errors.log | Select-Object -Unique -First 30 | ForEach-Object {
              $line = $_ -replace '::', ': :'
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              Write-Output "::error title=Build::$line"
            }
          }

      - name: Test
        run: dotnet test Duopilo.slnx -c Release --no-build -p:UseSimConnectStub=true --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: Fehlgeschlagene Tests als Annotation
        if: failure()
        shell: pwsh
        run: |
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            Select-Xml -Xml $trx -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | ForEach-Object {
              $r = $_.Node
              $msg = "$($r.Output.ErrorInfo.Message) | $((($r.Output.ErrorInfo.StackTrace -split "`n") | Select-Object -First 2) -join ' ')"
              $msg = $msg -replace "`r?`n", ' '
              if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
              Write-Output "::error title=$($r.testName)::$msg"
            }
          }

      - name: Test-Zusammenfassung
        if: always()
        shell: pwsh
        run: |
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            $c = (Select-Xml -Xml $trx -XPath '//t:ResultSummary/t:Counters' -Namespace $ns).Node
            Write-Output "::notice title=Tests::Gesamt $($c.total), bestanden $($c.passed), fehlgeschlagen $($c.failed), nicht ausgeführt $($c.notExecuted)"
          }

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse
          path: '**/TestResults/*.trx'
