name: Bench (temporary)
on:
  push:
    branches: ["bench/voice-after-beta"]
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
      - name: Bench
        run: dotnet run -c Release --project tools/bench/Bench.csproj -- "${{ runner.temp }}\bench"
