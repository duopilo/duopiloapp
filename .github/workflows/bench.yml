name: Bench (temporary)
on:
  push:
    branches: ["bench/voice-after-beta"]
    paths: [".github/workflows/bench.yml", "tools/whisperwav/**"]
permissions:
  contents: write
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: bench
      - uses: actions/checkout@v5
        with:
          ref: feat/supertonic-german
          path: app
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Supertonic live test (Duopilo engine), 1 and 2 threads
        shell: pwsh
        env:
          DUOPILO_SUPERTONIC_LIVE: "1"
          DUOPILO_SUPERTONIC_OUT: ${{ github.workspace }}\bench\results\live
          DUOPILO_SUPERTONIC_DATA: ${{ runner.temp }}\st-data
        run: |
          dotnet build app/tests/Duopilo.Tests/Duopilo.Tests.csproj -c Release -v q
          foreach ($t in 1, 2, 1, 2) {
            $env:DUOPILO_SUPERTONIC_THREADS = "$t"
            dotnet test app/tests/Duopilo.Tests/Duopilo.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~SupertonicTests.Live" 2>&1 | Select-String "Passed|Failed|Total"
            Get-Content "bench/results/live/supertonic-live-$t.md" | Add-Content bench/results/live/threads.md
            "" | Add-Content bench/results/live/threads.md
          }
      - name: Ergebnis ins Repo
        if: always()
        shell: pwsh
        working-directory: bench
        run: |
          git config user.name bench; git config user.email bench@users.noreply.github.com
          git add results; git commit -m "Live-Ergebnis Supertonic"; git push origin HEAD:bench/voice-after-beta
