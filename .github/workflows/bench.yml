name: Bench (temporary)
on:
  push:
    branches: ["bench/voice-after-beta"]
    paths: [".github/workflows/bench.yml", "tools/whisperwav/**", "tools/supertonic/**"]
permissions:
  contents: write
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: bench
      - uses: actions/checkout@v5
        with:
          ref: feat/supertonic-german
          path: app
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: CPU
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bench/results/same | Out-Null
          (Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String) | Out-File bench/results/same/cpu.txt
          python -m pip install --quiet huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('supertone-oss-archive/supertonic-3', revision='aafc6e32416a594460b32413efc49d7fe4ce6d46', local_dir=r'${{ runner.temp }}\st')"
      - name: Example port (same machine)
        env:
          SKIP_WHISPER: "1"
        run: dotnet run -c Release --project bench/tools/supertonic/Supertonic.Check.csproj -- "${{ runner.temp }}\st" "${{ runner.temp }}\work" bench/results/same
      - name: Duopilo engine (same machine), 1 thread
        shell: pwsh
        env:
          DUOPILO_SUPERTONIC_LIVE: "1"
          DUOPILO_SUPERTONIC_OUT: ${{ github.workspace }}\bench\results\same
          DUOPILO_SUPERTONIC_DATA: ${{ runner.temp }}\st-data
          DUOPILO_SUPERTONIC_THREADS: "1"
        run: |
          dotnet test app/tests/Duopilo.Tests/Duopilo.Tests.csproj -c Release --filter "FullyQualifiedName~SupertonicTests.Live" 2>&1 | Select-String "Passed|Failed|Total"
          Remove-Item bench/results/same/*.wav
      - name: Ergebnis ins Repo
        if: always()
        shell: pwsh
        working-directory: bench
        run: |
          git config user.name bench; git config user.email bench@users.noreply.github.com
          git add results; git commit -m "Live-Ergebnis Supertonic"; git push origin HEAD:bench/voice-after-beta
