name: Bench (temporary)
on:
  push:
    branches: ["bench/voice-after-beta"]
    paths: [".github/workflows/bench.yml"]
permissions:
  contents: write
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Supertonic-3-Dateien
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 -c "from huggingface_hub import snapshot_download; snapshot_download('supertone-oss-archive/supertonic-3', revision='aafc6e32416a594460b32413efc49d7fe4ce6d46', local_dir='st')"
          mkdir -p results
          (cd st && find . -type f -not -path './.cache/*' -printf '%s %p\n' | sort -k2 && echo && find . -type f -not -path './.cache/*' -exec sha256sum {} \; | sort -k2 && echo && head -c 600 onnx/tts.json && echo && python3 -c "import json;d=json.load(open('onnx/tts.json'));print(json.dumps({k:d[k] for k in d if k in ('ae','ttl','dp')},indent=1)[:3000])") > results/supertonic-files.txt
          git config user.name bench; git config user.email bench@users.noreply.github.com
          git add results; git commit -m "Supertonic-Dateien"; git push origin HEAD:bench/voice-after-beta
