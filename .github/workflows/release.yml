# Release: Duopilo für Windows bauen (self-contained, win-x64), Installer (Inno Setup) und ZIP erzeugen und beides
# an ein automatisch erstelltes GitHub Release mit Changelog hängen.
#
# Läuft
#  - bei einem Tag „v…“ (v0.9.1, v1.0.0-beta.1): baut und legt das Release als Entwurf (Draft) an – nicht öffentlich.
#    Die Version im Programm kommt aus dem Tag. Tags mit Zusatz („-beta.1“, „-rc.1“) werden als Pre-release markiert.
#    Veröffentlichen bewusst von Hand: auf GitHub im Entwurf „Publish release“ oder gh release edit v0.9.1 --draft=false.
#  - von Hand: Actions → Release → Run workflow (Version angeben) – nur bauen, Ergebnis unter „Artifacts“.
#    Mit Häkchen „Release anlegen“ (nur auf main): nach erfolgreichem Build Tag v<Version> setzen und Release wie oben.
#  - per Release-PR: Ein gemergter PR mit Label „release“ und Version im Titel setzt den Tag und startet diesen
#    Workflow auf dem Tag (release-pr.yml). Text über der ersten Linie „---“ im PR kommt oben in die Release-Beschreibung.
#  - bei Pull Requests, die diesen Workflow oder installer/ ändern – nur bauen, zum Testen.
#
# Auslösen:
#   git switch main && git pull
#   git tag v0.9.1
#   git push origin v0.9.1
#   – oder Run workflow mit Häkchen, oder Release-PR.
#
# SimConnect: Auf GitHub-Runnern gibt es das MSFS-2024-SDK nicht. Der Workflow nimmt die DLLs aus lib/ im Repo oder
# aus den Secrets SIMCONNECT_ZIP_1…6 (einmal anlegen mit: pwsh installer/simconnect-secret.ps1) – nur zum Bauen: Ins Paket
# kommen sie nicht (BundleSimConnect=false), Duopilo lädt sie zur Laufzeit aus dem installierten SDK und bietet sonst an,
# das SDK von Microsoft zu installieren. Ohne echtes SimConnect bricht ein Release ab – ein Build gegen den Stub könnte sich
# nicht mit MSFS verbinden. Testbuilds laufen dann mit Warnung gegen den Stub.
#
# Der Produktname steht zentral als <Product> in Directory.Build.props (Duopilo, bis 0.9.x Kopilot), die Programmdatei
# als <AssemblyName> im Projekt. Der Installer übernimmt eine vorhandene Kopilot-Installation (installer/setup.iss).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z. B. 0.10.0-beta.3 (ohne Häkchen nur Testbuild unter Artifacts)"
        type: string
        default: "0.0.0-test"
      release:
        description: "Release anlegen (nur auf main): Tag v<Version> setzen und Release als Entwurf"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  bauen:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
      exe: ${{ steps.version.outputs.exe }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      paket: ${{ steps.version.outputs.paket }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Repo holen
        uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Name und Version
        id: version
        shell: pwsh
        env:
          EREIGNIS: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EINGABE: ${{ inputs.version }}
          RELEASE_HAKEN: ${{ inputs.release }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          $props = (dotnet msbuild src/Duopilo/Duopilo.csproj -getProperty:Product -getProperty:AssemblyName | Out-String | ConvertFrom-Json).Properties
          if (-not $props.Product -or -not $props.AssemblyName) { Write-Output "::error::Product/AssemblyName ließen sich nicht aus dem Projekt lesen."; exit 1 }
          # Release, wenn der Lauf auf einem Tag steht (Tag gepusht oder Start auf dem Tag, z. B. aus release-pr.yml)
          # oder von Hand mit Häkchen „Release anlegen“ gestartet wurde. Sonst nur Testbuild.
          $release = 'false'
          if ($env:REF_TYPE -eq 'tag' -and $env:EREIGNIS -in @('push', 'workflow_dispatch')) {
            if ($env:REF_NAME -notmatch '^v') { Write-Output "::error::Tag '$env:REF_NAME' beginnt nicht mit v."; exit 1 }
            $version = $env:REF_NAME.Substring(1)
            $release = 'true'
          } elseif ($env:EREIGNIS -eq 'pull_request') {
            $version = "0.0.0-pr$env:PR"
          } else {
            $version = $env:EINGABE.Trim()
            if ($env:RELEASE_HAKEN -eq 'true') {
              if ($env:REF_NAME -ne 'main') { Write-Output "::error::Releases nur von main – der Lauf steht auf '$env:REF_NAME'."; exit 1 }
              if ($version -eq '0.0.0-test') { Write-Output "::error::Für ein Release die Version angeben, z. B. 0.10.0-beta.3."; exit 1 }
              $release = 'true'
            }
          }
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Output "::error::Version '$version' passt nicht zu 1.2.3 oder 1.2.3-beta.1 (Tag also v1.2.3)."
            exit 1
          }
          $tag = "v$version"
          if ($release -eq 'true' -and $env:REF_TYPE -ne 'tag') {
            # Vor dem langen Build prüfen, damit ein vorhandener Tag nicht erst am Ende auffällt
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Output "::error::Tag $tag gibt es schon."; exit 1 }
            $global:LASTEXITCODE = 0
          }
          $numerisch = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $name = $props.Product
          $exe = "$($props.AssemblyName).exe"
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          @("name=$name", "exe=$exe", "version=$version", "prerelease=$prerelease", "paket=$name-$version", "release=$release", "tag=$tag") |
            Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          @("APP_NAME=$name", "APP_EXE=$exe", "VERSION=$version", "VERSION_NUM=$numerisch") |
            Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Output "$name $version ($exe, Assembly-Version $numerisch, Pre-release: $prerelease)"

      - name: SimConnect bereitstellen
        id: simconnect
        shell: pwsh
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          SIMCONNECT_ZIP_1: ${{ secrets.SIMCONNECT_ZIP_1 }}
          SIMCONNECT_ZIP_2: ${{ secrets.SIMCONNECT_ZIP_2 }}
          SIMCONNECT_ZIP_3: ${{ secrets.SIMCONNECT_ZIP_3 }}
          SIMCONNECT_ZIP_4: ${{ secrets.SIMCONNECT_ZIP_4 }}
          SIMCONNECT_ZIP_5: ${{ secrets.SIMCONNECT_ZIP_5 }}
          SIMCONNECT_ZIP_6: ${{ secrets.SIMCONNECT_ZIP_6 }}
        run: |
          $managed = 'lib/Microsoft.FlightSimulator.SimConnect.dll'
          $native = 'lib/SimConnect.dll'
          if ((Test-Path $managed) -and (Test-Path $native)) {
            Write-Output "SimConnect aus lib/ im Repo."
          } else {
            $b64 = -join (1..6 | ForEach-Object { [Environment]::GetEnvironmentVariable("SIMCONNECT_ZIP_$_") } | Where-Object { $_ } | ForEach-Object { $_.Trim() })
            if ($b64) {
              $zip = Join-Path $env:RUNNER_TEMP 'simconnect.zip'
              [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
              Expand-Archive $zip -DestinationPath lib -Force
              Remove-Item $zip
              Write-Output "SimConnect aus den Secrets SIMCONNECT_ZIP_*."
            }
          }
          if ((Test-Path $managed) -and (Test-Path $native)) {
            Get-FileHash $managed, $native | ForEach-Object { Write-Output "  $(Split-Path -Leaf $_.Path)  $($_.Hash)" }
            "echt=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          } elseif ($env:RELEASE -eq 'true') {
            Write-Output "::error::Kein SimConnect: weder lib/*.dll noch die Secrets SIMCONNECT_ZIP_*. Einmal 'pwsh installer/simconnect-secret.ps1' auf dem PC mit dem MSFS-2024-SDK ausführen, dann den Lauf wiederholen."
            exit 1
          } else {
            Write-Output "::warning::Kein SimConnect (Secrets SIMCONNECT_ZIP_* fehlen) – Testbuild gegen den Stub, verbindet sich nicht mit MSFS."
            "echt=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          }

      - name: Veröffentlichen (self-contained, win-x64)
        shell: pwsh
        env:
          ECHT: ${{ steps.simconnect.outputs.echt }}
        run: |
          $stub = if ($env:ECHT -eq 'true') { 'false' } else { 'true' }
          # Gegen das echte SimConnect bauen, die DLLs aber nicht ausliefern (MSFS-SDK) – Duopilo lädt sie aus dem installierten SDK
          dotnet publish src/Duopilo/Duopilo.csproj -c Release -r win-x64 --self-contained true `
            "-p:Version=$env:VERSION" "-p:UseSimConnectStub=$stub" -p:ContinuousIntegrationBuild=true -p:BundleSimConnect=false `
            -o "out/$env:APP_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Version und SimConnect im Programm prüfen
        shell: pwsh
        env:
          ECHT: ${{ steps.simconnect.outputs.echt }}
        run: |
          $ordner = "out/$env:APP_NAME"
          $dll = (Resolve-Path (Join-Path $ordner ([IO.Path]::ChangeExtension($env:APP_EXE, '.dll')))).Path
          $ist = [Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString(3)
          if ($ist -ne $env:VERSION_NUM) { Write-Output "::error::$dll meldet Version $ist statt $env:VERSION_NUM."; exit 1 }
          Write-Output "Version im Programm: $ist"
          if ($env:ECHT -eq 'true') {
            # Die SimConnect-DLLs gehören zum MSFS-SDK und kommen nicht ins Paket (auch nicht der Stub)
            foreach ($datei in 'Microsoft.FlightSimulator.SimConnect.dll', 'SimConnect.dll') {
              if (Test-Path (Join-Path $ordner $datei)) {
                Write-Output "::error::$datei liegt im Paket – Release-Pakete dürfen SimConnect nicht enthalten (BundleSimConnect=false)."
                exit 1
              }
            }
            $deps = Get-Content (Join-Path $ordner ([IO.Path]::ChangeExtension($env:APP_EXE, '.deps.json'))) -Raw
            if ($deps -match 'SimConnectStub') { Write-Output "::error::Gebaut gegen den SimConnect-Stub."; exit 1 }
            Write-Output "SimConnect: gegen das SDK gebaut, nicht im Paket – kommt zur Laufzeit aus dem installierten SDK."
          }

      - name: Start ohne SimConnect prüfen
        # Paket ohne SimConnect, Runner ohne MSFS-SDK = Benutzer ohne SDK: Duopilo muss starten und das melden, nicht abstürzen
        shell: pwsh
        run: pwsh installer/smoke-test.ps1 -Exe "out/$env:APP_NAME/$env:APP_EXE"

      - name: Tests
        run: dotnet test Duopilo.slnx -c Release -p:UseSimConnectStub=true --logger "console;verbosity=minimal"

      - name: ZIP (ohne Installation)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $quelle = (Resolve-Path "out/$env:APP_NAME").Path
          $zip = Join-Path (Resolve-Path out).Path "$env:APP_NAME-$env:VERSION-win-x64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($quelle, $zip, [IO.Compression.CompressionLevel]::Optimal, $true)
          Write-Output "ZIP: $zip, $([math]::Round((Get-Item $zip).Length / 1MB)) MB"
          "ZIP=$zip" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Installer (Inno Setup)
        shell: pwsh
        run: pwsh installer/installer.ps1 -Quelle "out/$env:APP_NAME" -Version $env:VERSION -Name $env:APP_NAME -Exe $env:APP_EXE -Ziel out

      - name: Prüfsummen
        shell: pwsh
        run: |
          $zeilen = Get-Item $env:SETUP, $env:ZIP | ForEach-Object { "$((Get-FileHash $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path out).Path 'SHA256SUMS.txt'), ($zeilen -join "`n") + "`n")
          $zeilen

      - name: Pakete aufheben (14 Tage unter „Artifacts“)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.paket }}
          path: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
            out/SHA256SUMS.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  veroeffentlichen:
    name: GitHub Release
    needs: bauen
    if: needs.bauen.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Tag setzen (Start von Hand), Release anlegen
      actions: write # Pages-Workflow anstoßen, wenn Setup und ZIP am veröffentlichten Release hängen
      pull-requests: read # Release-PR zum Commit finden
    steps:
      - name: Repo holen (ganze Geschichte für den Changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag setzen (Start von Hand mit „Release anlegen“)
        # Erst nach erfolgreichem Build. Ein mit GITHUB_TOKEN gepushter Tag startet keinen weiteren Release-Lauf.
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ needs.bauen.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG gibt es schon."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice title=Tag::$TAG auf $GITHUB_SHA gesetzt."

      - name: Pakete aus dem Build holen
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.bauen.outputs.paket }}
          path: pakete

      - name: Changelog aus den Commits seit dem letzten Tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bauen.outputs.tag }}
          NAME: ${{ needs.bauen.outputs.name }}
          EXE: ${{ needs.bauen.outputs.exe }}
          VERSION: ${{ needs.bauen.outputs.version }}
          PRERELEASE: ${{ needs.bauen.outputs.prerelease }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Vorheriger Tag: für ein normales Release das letzte normale (Betas zählen nicht), für ein Pre-release das letzte überhaupt.
          if [ "$PRERELEASE" = "true" ]; then
            vorher=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          else
            vorher=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)
          fi
          if [ -n "$vorher" ]; then bereich="$vorher..$TAG"; else bereich="$TAG"; fi
          liste=$(git log --no-merges --pretty='tformat:- %s (%h)' "$bereich")
          anzahl=$(printf '%s\n' "$liste" | grep -c '^- ' || true)
          # Release-PR (Label „release“), der diesen Commit gebracht hat: Text über der ersten Linie „---“ kommt nach oben
          nummer=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(any(.labels[]; .name == "release"))][0].number // empty' 2>/dev/null || true)
          : > pr-text.md
          if [ -n "$nummer" ]; then
            { gh api "repos/$GITHUB_REPOSITORY/pulls/$nummer" --jq '.body // ""' || true; } | tr -d '\r' \
              | awk '/^---[[:space:]]*$/ { exit } { print }' > pr-text.md
            echo "Release-Text aus PR #$nummer."
          fi
          {
            if grep -q '[^[:space:]]' pr-text.md; then
              cat pr-text.md
              echo
            fi
            if [ -n "$vorher" ]; then echo "## Änderungen seit $vorher"; else echo "## Änderungen"; fi
            echo
            if [ "$anzahl" -eq 0 ]; then
              echo "Keine Commits seit $vorher."
            else
              printf '%s\n' "$liste" | sed -n '1,300p'
              if [ "$anzahl" -gt 300 ]; then echo "- … und $((anzahl - 300)) weitere"; fi
            fi
            if [ -n "$vorher" ]; then
              echo
              echo "**Alle Änderungen:** $REPO_URL/compare/$vorher...$TAG"
            fi
            echo
            echo "## Installation"
            echo
            echo "- **$NAME-$VERSION-Setup.exe**: Installer (Programme-Ordner, Startmenü, Desktop-Verknüpfung, auf Wunsch Autostart). Updates einfach darüber installieren, eigene Einstellungen bleiben erhalten."
            echo "- **$NAME-$VERSION-win-x64.zip**: ohne Installation, entpacken und $EXE starten."
            echo "- .NET muss nicht installiert sein. Die Dateien sind nicht signiert, Windows SmartScreen kann deshalb warnen (Weitere Informationen → Trotzdem ausführen). Prüfsummen: SHA256SUMS.txt."
            echo "- **SimConnect** kommt aus dem MSFS-2024-SDK (gehört Microsoft, nicht im Paket). Fehlt es, bietet Duopilo an, das SDK (Core) direkt von Microsoft zu laden und zu installieren."
          } > notes.md
          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bauen.outputs.tag }}
          TITEL: ${{ needs.bauen.outputs.name }} ${{ needs.bauen.outputs.version }}
          PRERELEASE: ${{ needs.bauen.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Lauf wiederholt: Dateien und Text ersetzen. Entwurf bleibt Entwurf, ein veröffentlichtes Release bleibt veröffentlicht.
            gh release upload "$TAG" pakete/* --clobber
            gh release edit "$TAG" --title "$TITEL" --notes-file notes.md
          else
            # Immer als Entwurf: Veröffentlichen ist ein eigener, bewusster Schritt. SimConnect ist nicht im Paket (MSFS-SDK).
            extra=(--draft)
            if [ "$PRERELEASE" = "true" ]; then extra+=(--prerelease); fi
            gh release create "$TAG" pakete/* --title "$TITEL" --notes-file notes.md --verify-tag "${extra[@]}"
          fi
          echo "Release (Entwurf: $(gh release view "$TAG" --json isDraft --jq .isDraft)): $(gh release view "$TAG" --json url --jq .url)"

      - name: Webseite aktualisieren
        # Wurde das Release auf GitHub direkt veröffentlicht (Tag beim Veröffentlichen angelegt), kommen Setup und ZIP erst jetzt
        # dazu. Das Hochladen mit GITHUB_TOKEN löst kein Release-Ereignis aus – deshalb den Pages-Workflow hier selbst starten,
        # damit der Download-Button auf duopilo.app die neue Version zeigt. Entwürfe ändern an der Seite nichts.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bauen.outputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false" ]; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "::notice title=Webseite::$TAG ist veröffentlicht – Pages-Lauf auf main gestartet."
          else
            echo "Entwurf – Webseite bleibt unverändert."
          fi
